[package]
name = "highlight-spans"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Tree-sitter ObjectScript highlight spans as attr/start/end tuples"

[dependencies]
thiserror = "1"
tree-sitter = ">=0.26.6"
tree-sitter-highlight = ">=0.26.6"
tree-sitter-language = "0.1.7"
tree-sitter-md = "0.5.3"
tree-sitter-objectscript-playground = "1.9.14"
tree-sitter-objectscript-routine = "1.9.14"
tree-sitter-json = "0.24.8"
tree-sitter-yaml = "0.7.2"
tree-sitter-python = "0.25.0"
tree-sitter-xml = "0.7.0"
tree-sitter-css = "0.25.0"
tree-sitter-html="0.23.2"
tree-sitter-javascript="0.25.0"
tree-sitter-jsdoc = "0.25.0"
tree-sitter-objectscript = "1.9.14"
tree-sitter-regex = "0.25.0"
tree-sitter-toml-ng = "0.7.0"

[build-dependencies]
cc = "1"
