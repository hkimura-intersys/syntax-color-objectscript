[package]
name = "theme-engine-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "C FFI bindings for theme-engine, highlight-spans, and render-ansi"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
theme-engine = { version = "0.10.0", path = "../theme-engine" }
highlight-spans = { version = "0.10.0", path = "../highlight-spans" }
render-ansi = { version = "0.10.0", path = "../render-ansi" }
